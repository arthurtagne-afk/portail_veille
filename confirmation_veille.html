<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confirmation de la collecte de veille d'actualité">
    <title>Confirmation Collecte Veille</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-blue-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="flex flex-col items-center mb-8">
            <img src="logo.png" alt="Logo Cabinet" class="h-16 mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Confirmation Collecte Veille</h1>
        </header>

        <main class="bg-white p-6 rounded-xl shadow-lg text-center">
            <p id="confirmation-message" class="text-lg text-gray-700 mb-8"></p>

            <div class="flex justify-center space-x-4">
                <a href="veille.html" id="new-entry-button">
                    <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center">
                        <span class="mr-2">➕</span> Nouvelle Collecte
                    </button>
                </a>
                <a href="index.html" id="home-button">
                    <button type="button" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center">
                        <span class="mr-2">🏠</span> Retour à l'accueil
                    </button>
                </a>
            </div>
        </main>
    </div>

    <script>
        // Retrieve and decode URL parameters
        const params = new URLSearchParams(window.location.search);
        const etablissement = params.get('etablissement') ? decodeURIComponent(params.get('etablissement')) : "Établissement inconnu";
        const collecteur = params.get('collecteur') ? decodeURIComponent(params.get('collecteur')) : "Collecteur inconnu";
        const date = new Date().toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });

        // Display confirmation message
        document.getElementById("confirmation-message").innerText =
            `✅ Collecte pour ${etablissement} enregistrée par ${collecteur} le ${date}.`;
    </script>
</body>
</html>
