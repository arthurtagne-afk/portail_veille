<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Formulaire de descente terrain pour l'évaluation des services de transfert d'argent"
    />
    <title>Descente Terrain - FTF</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      .min-w-custom {
        min-width: 150px;
      }
      .min-w-statut {
        min-width: 130px;
      }
      .input-cell {
        min-width: 100px;
      }
    </style>
  </head>
  <body class="bg-blue-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <header class="flex flex-col items-center mb-8">
        <img
          src="logo.png"
          alt="Logo MI Group"
          class="h-20 mb-4 object-contain"
          onerror="this.src='https://via.placeholder.com/150x110?text=MI+Group';"
        />
        <h1 class="text-2xl font-bold text-gray-800 text-center">
          Questionnaire Descente Terrain – FTF
        </h1>
      </header>

      <form
        id="form"
        class="bg-white p-6 rounded-xl shadow-lg"
        method="POST"
        action="#"
      >
        <div class="mb-8">
          <h2
            class="text-lg font-bold text-gray-800 border-b-2 border-blue-600 pb-2 mb-4"
          >
            Données Générales
          </h2>

          <div
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6"
          >
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Date <span class="text-red-500">*</span></label
              >
              <input
                type="date"
                id="date_descente"
                name="date_descente"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              />
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Heure <span class="text-red-500">*</span></label
              >
              <input
                type="time"
                id="heure"
                name="heure"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              />
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Ville <span class="text-red-500">*</span></label
              >
              <select
                id="ville"
                name="ville_select"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              >
                <option value="">-- Sélectionner --</option>
                <option>Yaoundé</option>
                <option>Douala</option>
                <option value="autre">Autre</option>
              </select>
              <input
                type="text"
                id="ville_custom"
                name="ville_custom"
                class="hidden w-full p-2 border border-gray-300 rounded-lg mt-2"
                placeholder="Préciser la ville"
              />
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Agent / Institution <span class="text-red-500">*</span></label
              >
              <select
                id="institution"
                name="institution_select"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              >
                <option value="">-- Sélectionner --</option>
                <option>UBA</option>
                <option>AFG</option>
                <option>Afriland</option>
                <option>Ecobank</option>
                <option>WafaCash</option>
                <option>Express Exchange</option>
                <option value="autre">Autre</option>
              </select>
              <input
                type="text"
                id="institution_custom"
                name="institution_custom"
                class="hidden w-full p-2 border border-gray-300 rounded-lg mt-2"
                placeholder="Préciser l'institution"
              />
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Nom du point de service
                <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                id="nom_point"
                name="nom_point"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              />
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Enquêteur <span class="text-red-500">*</span></label
              >
              <select
                id="enqueteur"
                name="enqueteur"
                class="w-full p-2 border border-gray-300 rounded-lg"
                required
              >
                <option value="">-- Sélectionner --</option>
                <option>Elie</option>
                <option>Edwin</option>
                <option>Ismael</option>
                <option>Othniel</option>
                <option>Hadja</option>
                <option>Stagiaire</option>
              </select>
            </div>
          </div>

          <h3 class="text-md font-bold text-gray-800 mb-2">
            Relevé des Offres et Tarifs
          </h3>
          <p class="text-sm text-gray-500 mb-2">
            Ajoutez une ligne pour chaque opérateur ou corridor évalué.
          </p>

          <div class="overflow-x-auto border rounded-lg mb-4 shadow-sm">
            <table class="min-w-full bg-white text-sm" id="tarifs-table">
              <thead class="bg-gray-100 text-gray-700 border-b">
                <tr>
                  <th class="py-3 px-4 text-left min-w-custom">
                    Opérateur <span class="text-red-500">*</span>
                  </th>
                  <th class="py-3 px-4 text-left min-w-statut">
                    État de service <span class="text-red-500">*</span>
                  </th>
                  <th class="py-3 px-4 text-left min-w-custom">
                    Type Service <span class="text-red-500">*</span>
                  </th>
                  <th class="py-3 px-4 text-left min-w-custom">
                    Corridor <span class="text-red-500">*</span>
                  </th>
                  <th class="py-3 px-4 text-left input-cell">Frais 250K</th>
                  <th class="py-3 px-4 text-left input-cell">Frais 500K</th>
                  <th class="py-3 px-4 text-left input-cell">Frais 1M</th>
                  <th class="py-3 px-4 text-center">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200"></tbody>
            </table>
          </div>

          <button
            type="button"
            id="add-row-btn"
            class="flex items-center px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm font-medium shadow"
          >
            <span class="mr-2 text-xl font-bold">+</span> Ajouter une ligne
          </button>
        </div>

        <div class="mb-8">
          <h2
            class="text-lg font-bold text-gray-800 border-b-2 border-green-600 pb-2 mb-4"
          >
            Évaluation Infrastructure / Service
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >1. Niveau d'affluence *</label
              ><select
                name="eval_affluence"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Faible (0–3 clients)</option>
                <option>Moyenne (4–7 clients)</option>
                <option>Élevée (8+ clients)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >2. Agence repérable *</label
              ><select
                name="reperable_ext"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Pas vraiment</option>
                <option>Acceptable</option>
                <option>Très repérable</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >3. Signalisation ext *</label
              ><select
                name="signalisation_ext"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Pas vraiment</option>
                <option>Acceptable</option>
                <option>Très repérable</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >4. Parking</label
              ><select
                name="parking"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option selected>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >5. Sécurité Ext</label
              ><select
                name="securite_ext"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >6. Conduite Agents</label
              ><select
                name="conduite_agents"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >7. Caisse dédiée</label
              ><select
                name="caisse_dedicee"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >8. Zone d'attente *</label
              ><select
                name="zone_attente"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >9. Logo comptoirs</label
              ><select
                name="logo_comptoirs"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >10. Visibilité offres *</label
              ><select
                name="visibilite_offres"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >11. Grille tarifaire *</label
              ><select
                name="grille_tarifaire"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >12. Temps d'attente *</label
              ><select
                name="temps_attente"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Moins de 5 min</option>
                <option>6-10 min</option>
                <option>Plus de 10 min</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >13. Promo en cours *</label
              ><select
                name="campagnes_promo"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >14. Politesse *</label
              ><select
                name="politesse"
                required
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >15. Code vestimentaire</label
              ><select
                name="code_vestimentaire"
                class="w-full p-2 border border-gray-300 rounded-lg"
              >
                <option value="">-- Sélectionner --</option>
                <option>Oui</option>
                <option>Non</option>
              </select>
            </div>
          </div>
        </div>

        <div class="mb-8">
          <h2
            class="text-lg font-bold text-gray-800 border-b-2 border-purple-600 pb-2 mb-4"
          >
            Observations
          </h2>
          <div class="space-y-4">
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >But de la descente</label
              >
              <textarea
                name="but_descente"
                rows="2"
                class="w-full p-2 border border-gray-300 rounded-lg"
              ></textarea>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Remarques Guichetier</label
              >
              <textarea
                name="remarques_guichetier"
                rows="2"
                class="w-full p-2 border border-gray-300 rounded-lg"
              ></textarea>
            </div>
            <div class="form-group">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Avis Clients (Voice of Customer)</label
              >
              <textarea
                name="avis_clients"
                rows="2"
                class="w-full p-2 border border-gray-300 rounded-lg"
              ></textarea>
            </div>
          </div>
        </div>

        <div class="form-actions flex justify-end space-x-4">
          <a href="index.html">
            <button
              type="button"
              class="px-4 py-2 border-2 border-black text-black rounded-lg hover:bg-black hover:text-white transition-colors"
            >
              Retour
            </button>
          </a>
          <button
            type="button"
            id="reset-button"
            class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors"
          >
            Effacer
          </button>
          <button
            type="submit"
            id="submit-button"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center"
          >
            <span>Enregistrer</span>
            <svg
              class="hidden animate-spin h-5 w-5 ml-2 text-white"
              id="spinner"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          </button>
        </div>
      </form>

      <div id="message" class="hidden mt-4 p-4 rounded-lg text-white"></div>
    </div>

    <script>
      // Initialisation
      const today = new Date().toISOString().split("T")[0];
      const now = new Date().toTimeString().slice(0, 5);
      document.getElementById("date_descente").value = today;
      document.getElementById("heure").value = now;

      // Gestion des champs "Autre" globaux
      const customFields = [
        { select: "ville", custom: "ville_custom" },
        { select: "institution", custom: "institution_custom" },
      ];

      customFields.forEach((field) => {
        const selectEl = document.getElementById(field.select);
        const customEl = document.getElementById(field.custom);
        selectEl.addEventListener("change", () => {
          if (selectEl.value === "autre") {
            customEl.classList.remove("hidden");
            customEl.required = true;
          } else {
            customEl.classList.add("hidden");
            customEl.required = false;
            customEl.value = "";
          }
        });
      });

      // --- LOGIQUE DU TABLEAU DYNAMIQUE ---
      const tableBody = document.querySelector("#tarifs-table tbody");
      const addRowBtn = document.getElementById("add-row-btn");

      function createRow() {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50 transition-colors";
        // Ajout de la colonne Etat de service apres Opérateur
        tr.innerHTML = `
          <td class="py-2 px-4 align-top">
            <select name="operateur[]" class="w-full p-2 border border-gray-300 rounded-lg text-sm trigger-other" required>
              <option value="">-- Choix --</option>
              <option>Western Union</option>
              <option>MoneyGram</option>
              <option>RIA</option>
              <option>Juba Express</option>
              <option value="autre">Autre</option>
            </select>
            <input type="text" name="operateur_custom[]" class="hidden w-full p-2 border border-gray-300 rounded-lg mt-1 text-sm custom-input" placeholder="Préciser" />
          </td>
          
          <td class="py-2 px-4 align-top">
            <select name="etat_service[]" class="w-full p-2 border border-gray-300 rounded-lg text-sm" required>
              <option value="">-- Choix --</option>
              <option>Ok</option>
              <option>Perturbé</option>
              <option>Hors Service</option>
            </select>
          </td>

          <td class="py-2 px-4 align-top">
            <select name="type_service[]" class="w-full p-2 border border-gray-300 rounded-lg text-sm trigger-other" required>
              <option value="">-- Choix --</option>
              <option>Cash to Cash</option>
              <option>Cash to Account</option>
              <option>Mobile Wallet</option>
              <option value="autre">Autre</option>
            </select>
            <input type="text" name="type_service_custom[]" class="hidden w-full p-2 border border-gray-300 rounded-lg mt-1 text-sm custom-input" placeholder="Préciser" />
          </td>

          <td class="py-2 px-4 align-top">
            <select name="corridor[]" class="w-full p-2 border border-gray-300 rounded-lg text-sm trigger-other" required>
              <option value="">-- Choix --</option>
              <option>Bénin</option>
              <option>Togo</option>
              <option>Burkina Faso</option>
              <option>Sénégal</option>
              <option>Nigeria</option>
              <option>Mali</option>
              <option value="autre">Autre</option>
            </select>
            <input type="text" name="corridor_custom[]" class="hidden w-full p-2 border border-gray-300 rounded-lg mt-1 text-sm custom-input" placeholder="Préciser" />
          </td>
          <td class="py-2 px-4 align-top">
             <input type="number" name="frais_250k[]" min="0" placeholder="0" class="w-full p-2 border border-gray-300 rounded-lg text-sm" />
          </td>
          <td class="py-2 px-4 align-top">
             <input type="number" name="frais_500k[]" min="0" placeholder="0" class="w-full p-2 border border-gray-300 rounded-lg text-sm" />
          </td>
          <td class="py-2 px-4 align-top">
             <input type="number" name="frais_1m[]" min="0" placeholder="0" class="w-full p-2 border border-gray-300 rounded-lg text-sm" />
          </td>
          <td class="py-2 px-4 align-top text-center">
            <button type="button" class="remove-row text-red-500 hover:text-red-700 font-bold text-lg" title="Supprimer">&times;</button>
          </td>
        `;
        return tr;
      }

      tableBody.appendChild(createRow()); // Ligne initiale

      addRowBtn.addEventListener("click", () => {
        tableBody.appendChild(createRow());
      });

      // Gestion événements tableau (Suppression & Champs "Autre")
      tableBody.addEventListener("click", (e) => {
        if (e.target.classList.contains("remove-row")) {
          if (tableBody.rows.length > 1) {
            e.target.closest("tr").remove();
          } else {
            alert("Une ligne minimum est requise.");
          }
        }
      });

      tableBody.addEventListener("change", (e) => {
        if (e.target.classList.contains("trigger-other")) {
          const select = e.target;
          const customInput = select.nextElementSibling;
          if (select.value === "autre") {
            customInput.classList.remove("hidden");
            customInput.required = true;
          } else {
            customInput.classList.add("hidden");
            customInput.required = false;
            customInput.value = "";
          }
        }
      });

      // --- SOUMISSION ---
      const form = document.getElementById("form");
      const submitButton = document.getElementById("submit-button");
      const resetButton = document.getElementById("reset-button");
      const messageDiv = document.getElementById("message");
      const spinner = document.getElementById("spinner");

      resetButton.addEventListener("click", () => {
        form.reset();
        document.getElementById("date_descente").value = today;
        document.getElementById("heure").value = now;
        tableBody.innerHTML = "";
        tableBody.appendChild(createRow());
        customFields.forEach((f) =>
          document.getElementById(f.custom).classList.add("hidden")
        );
        messageDiv.classList.add("hidden");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        messageDiv.textContent = "Traitement en cours...";
        messageDiv.classList.remove("hidden", "bg-red-500", "bg-green-500");
        messageDiv.classList.add("bg-yellow-500");
        submitButton.disabled = true;
        spinner.classList.remove("hidden");

        try {
          const formData = new FormData(form);
          const formDataObj = {};

          // 1. Récupérer les champs simples (hors tableau)
          for (let [key, value] of formData.entries()) {
            if (!key.endsWith("[]")) {
              formDataObj[key] = value;
            }
          }

          // 2. Traiter les champs "Autre" globaux
          const customGlobalSubmit = [
            { select: "ville_select", custom: "ville_custom" },
            { select: "institution_select", custom: "institution_custom" },
          ];
          customGlobalSubmit.forEach((field) => {
            if (formDataObj[field.select] === "autre") {
              formDataObj[field.select] = formDataObj[field.custom] || "";
            }
          });

          // 3. CONCATÉNATION DES DONNÉES DU TABLEAU AVEC VIRGULES
          const operateurs = [];
          const etats = [];
          const services = [];
          const corridors = [];
          const frais250 = [];
          const frais500 = [];
          const frais1m = [];

          const rows = tableBody.querySelectorAll("tr");

          rows.forEach((row) => {
            // Opérateur
            const opSelect = row.querySelector('[name="operateur[]"]');
            const opCustom = row.querySelector('[name="operateur_custom[]"]');
            operateurs.push(
              opSelect.value === "autre" ? opCustom.value : opSelect.value
            );

            // Etat de service
            etats.push(row.querySelector('[name="etat_service[]"]').value);

            // Type Service
            const svcSelect = row.querySelector('[name="type_service[]"]');
            const svcCustom = row.querySelector(
              '[name="type_service_custom[]"]'
            );
            services.push(
              svcSelect.value === "autre" ? svcCustom.value : svcSelect.value
            );

            // Corridor
            const corrSelect = row.querySelector('[name="corridor[]"]');
            const corrCustom = row.querySelector('[name="corridor_custom[]"]');
            corridors.push(
              corrSelect.value === "autre" ? corrCustom.value : corrSelect.value
            );

            // Frais (gestion des vides pour éviter des virgules sans valeurs si nécessaire, ici on garde la structure)
            frais250.push(
              row.querySelector('[name="frais_250k[]"]').value || "N/A"
            );
            frais500.push(
              row.querySelector('[name="frais_500k[]"]').value || "N/A"
            );
            frais1m.push(
              row.querySelector('[name="frais_1m[]"]').value || "N/A"
            );
          });

          // Assignation des chaines concaténées aux clés attendues par Google Script
          // Assurez-vous que vos en-têtes Google Sheet correspondent à ces clés (ex: 'operateur', 'etat_service', etc.)
          formDataObj["operateur"] = operateurs.join(", ");
          formDataObj["etat_service"] = etats.join(", "); // Nouvelle clé
          formDataObj["type_service"] = services.join(", ");
          formDataObj["corridor"] = corridors.join(", ");
          formDataObj["frais_250k"] = frais250.join(", ");
          formDataObj["frais_500k"] = frais500.join(", ");
          formDataObj["frais_1m"] = frais1m.join(", ");

          // Envoi
          const scriptURL =
            "https://script.google.com/macros/s/AKfycbxzGrPJHi7NLAh4JcvgK4e_68wahKd3qVUNW-KRsvb6CqZ1N_pmSI0g-m8MYeZ0zUGAlg/exec";
          const hiddenForm = document.createElement("form");
          hiddenForm.method = "POST";
          hiddenForm.action = scriptURL;
          hiddenForm.target = "_hiddenFrame";

          for (const key in formDataObj) {
            if (formDataObj[key] !== undefined) {
              const input = document.createElement("input");
              input.type = "hidden";
              input.name = key;
              input.value = formDataObj[key];
              hiddenForm.appendChild(input);
            }
          }

          const hiddenFrame = document.createElement("iframe");
          hiddenFrame.name = "_hiddenFrame";
          hiddenFrame.style.display = "none";
          document.body.appendChild(hiddenFrame);

          hiddenFrame.onload = function () {
            window.location.href = `confirmation_descente.html?institution=${encodeURIComponent(
              formDataObj.institution_select
            )}&point=${encodeURIComponent(
              formDataObj.nom_point
            )}&enqueteur=${encodeURIComponent(formDataObj.enqueteur)}`;
          };

          document.body.appendChild(hiddenForm);
          hiddenForm.submit();
        } catch (error) {
          console.error(error);
          messageDiv.textContent = "Erreur: " + error.message;
          messageDiv.classList.add("bg-red-500");
          submitButton.disabled = false;
          spinner.classList.add("hidden");
        }
      });
    </script>
  </body>
</html>
