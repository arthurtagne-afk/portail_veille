<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Confirmation de l'audit IntelliBank MI - Baromètre de l'Expérience Client"
    />
    <title>Confirmation Audit IntelliBank</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-blue-100 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
      <header class="flex flex-col items-center mb-8">
        <img
          src="logo.png"
          alt="Logo MI Group"
          class="h-20 mb-4 object-contain"
          onerror="this.src='https://via.placeholder.com/150x110?text=MI+Group';"
        />
        <h1 class="text-2xl font-bold text-gray-800 text-center">
          Confirmation Audit IntelliBank
        </h1>
      </header>

      <main class="bg-white p-6 rounded-xl shadow-lg text-center">
        <p id="confirmation-message" class="text-lg text-gray-700 mb-8"></p>

        <div class="flex flex-wrap justify-center gap-4">
          <a href="intellibank.html" id="new-entry-button">
            <button
              type="button"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center"
            >
              <span class="mr-2">➕</span> Nouvel audit
            </button>
          </a>
          <a href="index.html" id="home-button">
            <button
              type="button"
              class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center"
            >
              <span class="mr-2">🏠</span> Retour à l'accueil
            </button>
          </a>
        </div>
      </main>

      <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>&copy; 2025 MI Group. Tous droits réservés.</p>
      </footer>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const banque = params.get("banque") || "Banque inconnue";
      const agence = params.get("agence") || "agence inconnue";
      const auditeur = params.get("auditeur") || "Auditeur inconnu";
      const date = new Date().toLocaleDateString("fr-FR", {
        year: "numeric",
        month: "long",
        day: "numeric",
      });

      document.getElementById(
        "confirmation-message"
      ).innerText = `✅ Audit de l'agence ${agence} (${banque}) enregistré par ${auditeur} le ${date}.`;
    </script>
  </body>
</html>
